; PlatformIO project settings (PlatformIO proje ayarları)
[platformio]
src_dir = firmware/maze_bot   ; where the code lives (kodun olduğu klasör)

[env:uno]
platform = atmelavr           ; Arduino Uno chip family (Uno'nun işlemci ailesi)
board = uno                   ; our board (kartımız)
framework = arduino           ; use Arduino commands (Arduino komutlarını kullan)
monitor_speed = 9600          ; must match Serial.begin(9600) (Serial.begin ile aynı olmalı)
